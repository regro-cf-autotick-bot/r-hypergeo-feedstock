{% set version = "1.2-15" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-hypergeo
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/hypergeo_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/hypergeo/hypergeo_{{ version }}.tar.gz
  sha256: 4b7d59c9566f67ca34d64a9ec6d0ae4a6a0a2b6a5e9d6a59621c9583daf2ac22

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-contfrac >=1.1_9
    - r-desolve
    - r-elliptic >=1.3_5
  run:
    - r-base
    - r-contfrac >=1.1_9
    - r-desolve
    - r-elliptic >=1.3_5

test:
  commands:
    - $R -e "library('hypergeo')"           # [not win]
    - "\"%R%\" -e \"library('hypergeo')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=hypergeo
  license: GPL-2.0-only
  summary: The Gaussian hypergeometric function for complex numbers.
  license_family: GPL2
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2

extra:
  recipe-maintainers:
    - conda-forge/r
